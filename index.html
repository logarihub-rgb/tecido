<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tecido">
<title>Tecido</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0d;--card:#1a1815;--card2:#221f1b;--ink:#ece4d4;--mut:#9a907c;--line:#2e2a24;--acc:#b8904f;--acc-ink:#15120e;--ok:#8fae6b;--warn:#d6a74a;--bad:#c4553b;--r:12px;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{background:
 repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
 repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px),
 radial-gradient(ellipse at top,#1d1a16 0%,#0f0e0d 60%);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(12,11,10,.96);backdrop-filter:blur(6px);color:var(--ink);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
header h1{margin:0;font:800 20px/1 var(--serif);letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
header small{color:var(--mut);font-size:11px;letter-spacing:.5px}
main{padding:14px 12px 100px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0c0b0a;border-top:1px solid var(--acc);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.big{font:800 30px/1.1 var(--serif);letter-spacing:-.3px;color:var(--ink)}
.mid{font:700 19px/1.2 var(--serif)}
.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:#2a2620;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a35,var(--acc))}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:3px;background:#2a2620;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3c4a2e}.pill.warn{color:var(--warn);border-color:#5a4724}.pill.bad{color:var(--bad);border-color:#5a2a20}.pill.pe{color:#c9b892;border-color:#4a4233}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit}
.item b{font-family:var(--serif);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 12px;font:inherit;font-size:12px;letter-spacing:.4px;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
select,input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#141210;color:var(--ink);color-scheme:dark}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:8px;padding:14px;font:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;background:var(--acc);color:var(--acc-ink);margin-top:14px}
.btn.sec{background:transparent;color:var(--acc)}
.btn.wa{background:#1f3b2a;border-color:#2f5a3f;color:#cfe9d6}
.fab{position:fixed;right:16px;bottom:84px;z-index:7;border:1px solid var(--acc);border-radius:30px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:13px;padding:14px 20px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cor{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:#141210}
.cor span{display:flex;align-items:center;gap:6px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:inline-block;flex:none}
.step{display:flex;align-items:center}
.step button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#221f1b;color:var(--ink);font-size:18px}
.step input{width:40px;border:0;background:transparent;text-align:center;padding:4px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);border-top:1px solid var(--acc);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 8px;font:800 22px/1.2 var(--serif)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:1px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;font-weight:600}
.load{position:fixed;inset:0;background:rgba(10,9,8,.7);z-index:30;display:flex;align-items:center;justify-content:center;font:700 16px var(--serif);letter-spacing:2px;color:var(--acc)}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto;text-align:center}
#login h1{font:800 44px/1 var(--serif);letter-spacing:8px;color:var(--acc);margin:0 0 6px}
#login .rule{height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:14px 0 22px}
#login input{font-size:26px;text-align:center;letter-spacing:10px}
.alert{border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.estq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.estq div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}
.estq b{display:block;font:800 22px var(--serif)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.rolos{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rolo{display:grid;grid-template-columns:48px 1fr 92px 30px;gap:8px;align-items:center;background:#141210;border:1px solid var(--line);border-radius:8px;padding:6px}
.rolo img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.rolo select,.rolo input{padding:7px 8px;font-size:14px}
.rolo .x{border:0;background:none;color:var(--bad);font-size:20px}
.tot{font:800 26px var(--serif);color:var(--acc)}
#cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;font-weight:600}
#cam .camtop button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:1px}
#cam .cambar{background:#0c0b0a;border-top:1px solid var(--acc);padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
#camthumbs{display:flex;gap:6px;overflow-x:auto;width:100%;min-height:52px}
#camthumbs div{position:relative;flex:none}
#camthumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#camthumbs span{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.7);color:var(--acc);border-radius:0 0 6px 6px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--acc);background:#ece4d4;box-shadow:0 0 0 4px #0c0b0a inset}
.shutter:active{transform:scale(.92);background:var(--acc)}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:.7;pointer-events:none;animation:fl .25s forwards}
@keyframes fl{to{opacity:0}}
</style>
</head>
<body>
<div id="login">
  <h1>TECIDO</h1>
  <p class="mut" style="margin:0;letter-spacing:3px;text-transform:uppercase;font-size:11px">Logari · Mooca</p><div class="rule"></div>
  <p class="mut" style="margin:0 0 10px">Digite seu PIN</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="btn" onclick="entrar()">Entrar</button>
  <p id="lerr" style="color:var(--bad)"></p>
</div>
<div id="app" style="display:none">
  <header><div><h1>Tecido</h1><small id="sub"></small></div><button onclick="carregar()" style="background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--acc);font:inherit;font-size:12px">↻ Atualizar</button></header>
  <main id="view"></main>
  <nav>
    <button data-t="inicio" onclick="ir('inicio')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-t="vendas" onclick="ir('vendas')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Vendas</button>
    <button data-t="estoque" onclick="ir('estoque')"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Estoque</button>
    <button data-t="credito" onclick="ir('credito')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Crédito</button>
    <button data-t="relat" onclick="ir('relat')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Relatórios</button>
  </nav>
</div>
<div id="modal"></div>
<script>
const COR_HEX={Preto:'#1d1d1d',Marrom:'#6b4226',Branco:'#f4f1ea',Marfim:'#efe6cf',Rubro:'#9b1c2c',Marinho:'#1f2f57',Rubi:'#b0124a',Canela:'#a5643a',Amarelo:'#e8c33a',Frozen:'#bcd7e6',Hera:'#e58fb5'};
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let PIN='',D=null,TAB='inicio',F={mes:'',cli:'',st:'todos',tipo:'todos'},R={mes:''};
const $=s=>document.querySelector(s);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kg=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+' kg';
const n0=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const dbr=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const mesNome=m=>m?MES[+m.slice(5,7)-1]+'/'+m.slice(2,4):'';
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function getStore(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function loading(on){let e=$('#ld');if(on&&!e){e=document.createElement('div');e.id='ld';e.className='load';e.textContent='Carregando…';document.body.appendChild(e)}if(!on&&e)e.remove()}
const API='https://script.google.com/macros/s/AKfycbyQv3EXg8p4_41qEuMetFS5D7rf9SCjlbpyPJ3i71U3NaOEJM9qj5SaHOn49GnSwUYc/exec';
async function post(action,p){const r=await fetch(API,{method:'POST',body:JSON.stringify({pin:PIN,action,p:p||{}}),redirect:'follow'});const j=await r.json();if(!j||!j.ok)throw new Error(j?j.erro:'Erro');return j}
async function call(action,p){loading(true);try{return await post(action,p)}catch(e){if(/Failed to fetch|NetworkError|Load failed/.test(e.message))throw new Error('Sem conexão. Tente de novo.');throw e}finally{loading(false)}}

async function entrar(){PIN=$('#pin').value.trim();try{await call('login');store('tec_pin',PIN);$('#login').style.display='none';$('#app').style.display='block';carregar()}catch(e){$('#lerr').textContent=e.message;store('tec_pin')}}
async function carregar(){try{const r=await call('dados');setD(r.data)}catch(e){toast(e.message);if(/PIN/.test(e.message)){store('tec_pin');location.reload()}}}
function setD(d){D=d;$('#sub').textContent=d.user.nome+' · atualizado '+d.atualizado;if(!F.mes){F.mes=d.vendas.length?ultimoMes():'';R.mes=F.mes}render()}
async function acao(action,p,fechar=true){try{const r=await call(action,p);toast(r.msg||'Salvo');if(fechar)close_();setD(r.data)}catch(e){toast('Erro: '+e.message)}}
function ir(t){TAB=t;window.scrollTo(0,0);render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));const v=$('#view');v.innerHTML=({inicio:vInicio,vendas:vVendas,estoque:vEstoque,credito:vCredito,relat:vRelat})[TAB]()}

/* ---- dados derivados ---- */
function todas(){return D.vendas.concat(D.inv.retiradas||[])}
function meses(){return [...new Set(todas().map(x=>x.mes).filter(Boolean))].sort().reverse()}
function ultimoMes(){return meses()[0]||''}
function statusV(x){
  if(x.tipo==='pronta')return x.pago?{t:'Pago',c:'ok'}:{t:'A receber',c:'warn'};
  if(!x.dataEntrega)return{t:'A entregar',c:'pe'};
  if(!x.pago)return{t:'A receber',c:'warn'};
  return{t:'Concluído',c:'ok'};
}
function aReceber(x){if(x.pago)return 0;const v=x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado);return Math.max(0,v-(x.recebido||0))}

/* ---- INÍCIO ---- */
function vInicio(){
  const c=D.credito,m=ultimoMes(),vm=todas().filter(x=>x.mes===m);
  const pend=pendentes();
  const rec=todas().reduce((s,x)=>s+aReceber(x),0);
  const venc=c.aberto.filter(x=>x.dias<=3);
  const pct=Math.min(100,c.usado/c.limite*100);
  let h='';
  venc.forEach(x=>h+=`<div class="card alert ${x.dias<0?'bad':''}" onclick="ir('credito')"><b>${x.dias<0?'Nota vencida':'Nota vence '+(x.dias===0?'hoje':'em '+x.dias+' dia'+(x.dias>1?'s':''))}</b> · ${brl(x.valor)} (${dbr(x.venc)})</div>`);
  h+=`<div class="card" onclick="ir('credito')"><div class="row sp"><div><div class="k">Crédito fornecedor · em aberto</div><div class="big">${brl(c.valorAberto)}</div></div><div style="text-align:right"><div class="k">Disponível</div><div class="mid">${kg(c.disponivel)}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut" style="font-size:13px">${kg(c.usado)} usados de ${kg(c.limite)}</div></div>`;
  h+=`<div class="grid2"><div class="card" onclick="ir('estoque')"><div class="k">Estoque livre</div><div class="mid">${n0(D.inv.estoque.qtde-comprometido().qtde)} rolos</div><div class="mut">${n0(D.inv.estoque.qtde)} total · ${n0(comprometido().qtde)} comprometidos</div></div>
  <div class="card"><div class="k">A entregar</div><div class="mid">${pend.length} pedidos</div><div class="mut">${n0(pend.reduce((s,x)=>s+x.qtdPedido,0))} rolos</div></div>
  <div class="card"><div class="k">A receber</div><div class="mid">${brl(rec)}</div></div>
  <div class="card"><div class="k">Vendido ${mesNome(m)}</div><div class="mid">${kg(vm.reduce((s,x)=>s+(x.kgEntregue||0),0))}</div>${D.user.dono?`<div style="color:var(--ok);font-weight:600">Lucro ${brl(vm.reduce((s,x)=>s+(x.lucro||0),0))}</div>`:''}</div></div>`;
  h+=`<div class="card"><div class="k" style="margin-bottom:8px">Ações rápidas</div><div class="grid2">
  <button class="btn" style="margin:0" onclick="fPedido()">+ Pedido</button>
  <button class="btn" style="margin:0" onclick="fRetirada()">+ Retirada</button>
  <button class="btn sec" style="margin:0" onclick="fFornecedor()">Pedido fornecedor</button>
  <button class="btn sec" style="margin:0" onclick="ir('credito')">Crédito</button></div></div>`;
  if(pend.length){h+=`<div class="k" style="margin:14px 4px 6px">Aguardando entrega</div>`;pend.slice(0,6).forEach(x=>h+=itemV(x))}
  return h;
}

/* ---- VENDAS ---- */
function itemV(x){
  const s=statusV(x),i=todas().indexOf(x);
  const qt=x.tipo==='pronta'?x.qtdEntregue:x.qtdPedido;
  const val=x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado);
  return `<button class="item" onclick="detV(${i})"><div class="row sp"><b>${esc(x.cliente)}</b><span class="pill ${s.c}">${s.t}</span></div>
  <div class="row sp mut" style="font-size:13px;margin-top:3px"><span>${dbr(x.data)} · ${x.tipo==='pronta'?'<span class="pill pe" style="font-size:10px">Pronta entrega</span>':esc(x.protocolo)} · ${n0(qt)} rolos</span><span>${brl(val)}</span></div></button>`;
}
function vVendas(){
  const ms=meses();
  let l=todas().filter(x=>(!F.mes||x.mes===F.mes)&&(!F.cli||x.cliente===F.cli)&&(F.tipo==='todos'||x.tipo===F.tipo)&&(F.st==='todos'||statusV(x).t===F.st));
  l.sort((a,b)=>(b.data||'')<(a.data||'')?-1:1);
  let h=`<div class="grid2" style="margin-bottom:8px"><select onchange="F.mes=this.value;render()"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${m===F.mes?'selected':''}>${mesNome(m)}</option>`).join('')}</select>
  <select onchange="F.cli=this.value;render()"><option value="">Todos clientes</option>${D.clientes.map(c=>`<option ${c===F.cli?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`;
  h+=`<div class="chips">${['todos','A entregar','A receber','Concluído','Pago'].map(s=>`<button class="${F.st===s?'on':''}" onclick="F.st='${s}';render()">${s==='todos'?'Todos':s}</button>`).join('')}</div>`;
  h+=`<div class="chips">${[['todos','Tudo'],['encomenda','Encomendas'],['pronta','Pronta entrega']].map(s=>`<button class="${F.tipo===s[0]?'on':''}" onclick="F.tipo='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`;
  const tkg=l.reduce((s,x)=>s+(x.kgEntregue||0),0),tv=l.reduce((s,x)=>s+(x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado)),0);
  h+=`<div class="card row sp"><div><div class="k">${l.length} vendas</div><b>${kg(tkg)}</b></div><div style="text-align:right"><div class="k">Valor</div><b>${brl(tv)}</b></div>${D.user.dono?`<div style="text-align:right"><div class="k">Lucro</div><b style="color:var(--ok)">${brl(l.reduce((s,x)=>s+(x.lucro||0),0))}</b></div>`:''}</div>`;
  h+=l.map(itemV).join('')||'<p class="mut">Nenhuma venda nesse filtro.</p>';
  return h+`<button class="fab" onclick="fPedido()">+ Pedido</button>`;
}
function tabCores(a,b,la,lb){

}

/* ---- FORMULÁRIOS ---- */
function open_(h){$('#modal').innerHTML=`<div class="sheet" onclick="if(event.target===this)close_()"><div>${h}<button class="btn sec" onclick="close_()">Fechar</button></div></div>`}
function close_(){fecharCamera();$('#modal').innerHTML=''}
function coresInput(id,val){
  return `<div class="cores" id="${id}">${D.cores.map(k=>`<div class="cor"><span><i class="dot" style="background:${COR_HEX[k]}"></i>${k}</span><span class="step"><button type="button" onclick="stp(this,-1)">−</button><input inputmode="numeric" data-c="${k}" value="${val&&val[k]||''}" placeholder="0"><button type="button" onclick="stp(this,1)">+</button></span></div>`).join('')}</div>`;
}
function stp(b,d){const i=b.parentNode.querySelector('input');i.value=Math.max(0,(+i.value||0)+d)||'';i.dispatchEvent(new Event('input',{bubbles:true}))}
function lerCores(id){const o={};document.querySelectorAll('#'+id+' input').forEach(i=>{if(+i.value)o[i.dataset.c]=+i.value});return o}
function cliInput(v){return `<label>Cliente</label><input id="fcli" list="lcli" value="${esc(v||'')}" placeholder="Nome do cliente"><datalist id="lcli">${D.clientes.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
const val=id=>$('#'+id).value;

function fPedido(i){

  <label>Rolos por cor</label>${coresInput('fc',x&&x.pedido)}
  <p class="mut" id="fres"></p>
  <label>Valor já recebido (R$)</label><input id="frec" inputmode="decimal" value="${x&&x.recebido||''}" placeholder="0,00">
  <button class="btn" onclick="sPedido(${x?`'${esc(x.aba)}',${x.linha}`:''})">Salvar</button>`);
  const up=()=>{const t=Object.values(lerCores('fc')).reduce((a,b)=>a+b,0),k=t*D.padrao.kgRolo;$('#fres').textContent=`${t} rolos ≈ ${kg(k)} ≈ ${brl(k*num(val('fpk')))}`};
  $('#fc').addEventListener('input',up);$('#fpk').addEventListener('input',up);up();
}
const num=s=>{s=String(s==null?'':s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0};
function sPedido(aba,linha){const c=val('fcli').trim();if(!c)return toast('Informe o cliente');const cores=lerCores('fc');if(!Object.keys(cores).length)return toast('Informe os rolos');
  acao('salvarPedido',{aba,linha,cliente:c,data:val('fdt'),precoKg:num(val('fpk')),cores,recebido:val('frec')?num(val('frec')):''})}
let ROLOS=[];
function fEntrega(i){
  const x=todas()[i];ROLOS=[];
  open_(`<h2>Entrega · ${esc(x.cliente)}</h2><p class="mut" style="margin:0">${esc(x.protocolo)} · pedido de ${n0(x.qtdPedido)} rolos</p>
  <div class="card" style="margin-top:12px"><div class="row sp"><div><div class="k">Etiquetas dos rolos</div><div class="mut" style="font-size:12px">Lê o peso líquido e a cor de cada foto</div></div>
  <div class="row"><button class="btn" style="width:auto;margin:0;padding:10px 12px" onclick="abrirCamera(${i})">📷 Câmera</button><label class="btn sec" style="width:auto;margin:0;padding:10px 12px;cursor:pointer">🖼<input type="file" accept="image/*" multiple style="display:none" onchange="addFotos(this.files,${i});this.value=''"></label></div></div>
  <div class="rolos" id="frolos"></div><div id="ftot"></div></div>
  <label>Data da entrega</label><input id="fdt" type="date" value="${x.dataEntrega||hoje()}">
  <label>Rolos entregues por cor</label>${coresInput('fc',x.qtdEntregue?x.entregue:x.pedido)}
  <label>Quilos entregues (peso líquido)</label><input id="fkg" inputmode="decimal" value="${x.kgEntregue?String(x.kgEntregue).replace('.',','):''}" placeholder="ex: 191,41">
  <label>Data da nota do fornecedor (faturamento)</label><input id="fnf" type="date" value="${x.dataEntrega||hoje()}">
  <div class="check"><input type="checkbox" id="fcr" ${x.dataEntrega?'':'checked'}> Lançar no crédito do fornecedor (vence em 15 dias)</div>
  <button class="btn" onclick="acao('registrarEntrega',{aba:'${esc(x.aba)}',linha:${x.linha},data:val('fdt'),dataNF:val('fnf'),credito:$('#fcr').checked,cores:lerCores('fc'),kg:num(val('fkg'))})">Salvar entrega</button>
  <button class="btn wa" onclick="whats(${i})">Enviar total no WhatsApp</button>`);
}
function reduzir(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const thumb=(()=>{const t=document.createElement('canvas');const s2=96/Math.max(c.width,c.height);t.width=c.width*s2;t.height=c.height*s2;t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)})();res({b64:c.toDataURL('image/jpeg',.82).split(',')[1],thumb});URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function lerRolo(z,i){const r={thumb:z.thumb,kg:'',cor:'',st:'lendo'};ROLOS.push(r);desenhaRolos(i);
  try{const res=await post('ocr',{img:z.b64});r.kg=res.r.kg||'';r.cor=res.r.cor||'';r.st=r.kg?'ok':'ver';r.txt=res.r.texto||''}catch(e){r.st='erro';r.err=e.message}
  desenhaRolos(i);camThumbs()}
async function addFotos(files,i){for(const f of [...files]){try{lerRolo(await reduzir(f),i)}catch(e){toast('Foto inválida')}}}
let CAM=null;
async function abrirCamera(i){
  fecharCamera();
  const ov=document.createElement('div');ov.id='cam';
  ov.innerHTML=`<video playsinline autoplay muted></video><div class="camtop"><span id="camn">Aponte para a etiqueta</span><button onclick="fecharCamera()">Concluir</button></div><div class="cambar"><div id="camthumbs"></div><button class="shutter" aria-label="Tirar foto" onclick="clique(${i})"></button></div>`;
  document.body.appendChild(ov);camThumbs();
  try{CAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});ov.querySelector('video').srcObject=CAM}
  catch(e){fecharCamera();toast('Não consegui abrir a câmera. Use o botão 🖼.')}
}
function clique(i){
  const v=$('#cam video');if(!v||!v.videoWidth)return;
  const M=1600,sc=Math.min(1,M/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const t=document.createElement('canvas'),s2=96/Math.max(c.width,c.height);t.width=c.width*s2;t.height=c.height*s2;t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  const f=document.createElement('div');f.className='flash';$('#cam').appendChild(f);setTimeout(()=>f.remove(),300);
  if(navigator.vibrate)navigator.vibrate(30);
  lerRolo({b64:c.toDataURL('image/jpeg',.85).split(',')[1],thumb:t.toDataURL('image/jpeg',.7)},i);
}
function camThumbs(){
  const el=$('#camthumbs');if(!el)return;
  const tot=ROLOS.filter(r=>+r.kg>0).reduce((s,r)=>s+ +r.kg,0);
  $('#camn').textContent=ROLOS.length?`${ROLOS.length} foto${ROLOS.length>1?'s':''} · ${kg(tot)}`:'Aponte para a etiqueta';
  el.innerHTML=ROLOS.map(r=>`<div>${r.thumb?`<img src="${r.thumb}">`:''}<span>${r.st==='lendo'?'…':r.kg?String(r.kg).replace('.',','):'?'}</span></div>`).join('');
  el.scrollLeft=el.scrollWidth;
}
function fecharCamera(){if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null}const o=$('#cam');if(o)o.remove()}
function desenhaRolos(i){
  const el=$('#frolos');if(!el)return;
  el.innerHTML=ROLOS.map((r,j)=>`<div class="rolo">${r.thumb?`<img src="${r.thumb}">`:'<div></div>'}
  <select onchange="ROLOS[${j}].cor=this.value;somaRolos()"><option value="">${r.st==='lendo'?'Lendo…':'Cor?'}</option>${D.cores.map(c=>`<option ${c===r.cor?'selected':''}>${c}</option>`).join('')}</select>
  <input inputmode="decimal" value="${r.kg?String(r.kg).replace('.',','):''}" placeholder="${r.st==='lendo'?'…':r.st==='erro'?'erro':'kg'}" oninput="ROLOS[${j}].kg=num(this.value);somaRolos()" style="${r.st==='ver'||r.st==='erro'?'border-color:var(--bad)':''}">
  <button class="x" onclick="ROLOS.splice(${j},1);desenhaRolos(${i})">×</button></div>`).join('');
  somaRolos();
}
function somaRolos(){
  const ok=ROLOS.filter(r=>+r.kg>0),tot=ok.reduce((s,r)=>s+ +r.kg,0),porCor={};
  ok.forEach(r=>{if(r.cor)porCor[r.cor]=(porCor[r.cor]||0)+1});
  const lendo=ROLOS.filter(r=>r.st==='lendo').length,falta=ROLOS.filter(r=>r.st!=='lendo'&&!(+r.kg>0)).length;
  $('#ftot').innerHTML=ROLOS.length?`<div class="row sp" style="margin-top:10px"><div><div class="k">${ROLOS.length} rolo${ROLOS.length>1?'s':''}${lendo?' · lendo '+lendo:''}${falta?' · <span style="color:var(--bad)">'+falta+' sem peso</span>':''}</div><div class="mut" style="font-size:12px">${Object.entries(porCor).map(([c,q])=>q+' '+c).join(' · ')}</div></div><div class="tot">${kg(tot)}</div></div>`:'';
  if(ok.length){$('#fkg').value=String(Math.round(tot*100)/100).replace('.',',');
    if(Object.keys(porCor).length){document.querySelectorAll('#fc input').forEach(inp=>{inp.value=porCor[inp.dataset.c]||''})}}
}
function whats(i){
  const x=todas()[i],k=num(val('fkg')),cores=lerCores('fc'),q=Object.values(cores).reduce((a,b)=>a+b,0);

  const v=k*x.precoKg,rec=x.recebido||0,dif=rec-v;
  let t=`Olá, ${x.cliente}! Segue o fechamento do pedido ${x.protocolo}:\n\n`;
  t+=Object.entries(cores).map(([c,n])=>`• ${c}: ${n} rolo${n>1?'s':''}`).join('\n');
  t+=`\n\nTotal: ${q} rolos · ${kg(k)} (peso líquido)\nPreço: ${brl(x.precoKg)}/kg\n*Valor: ${brl(v)}*`;
  if(rec>0)t+=`\n\nJá pago: ${brl(rec)}\n${dif>=0.01?'*Diferença a devolver: '+brl(dif)+'*':dif<=-0.01?'*Falta pagar: '+brl(-dif)+'*':'Tudo certo, sem diferença.'}`;
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}

/* ---- ESTOQUE ---- */
const INTERNO=/^(LOGARI|INVENT[AÁ]RIO)$/i;
function pendentes(){return D.vendas.filter(x=>!x.dataEntrega&&x.qtdPedido>0&&!INTERNO.test(x.cliente))}
function comprometido(){const o={};let q=0,n=0;pendentes().forEach(x=>{n++;for(const k in x.pedido){o[k]=(o[k]||0)+x.pedido[k];q+=x.pedido[k]}});return{cores:o,qtde:q,pedidos:n}}
function vEstoque(){

  <button class="btn" onclick="acao('receberFornecedor',{linha:${p.linha},data:val('fdt'),dataNF:val('fnf'),cores:lerCores('fc'),kg:num(val('fkg')),preco:${p.preco||0},credito:$('#fcr').checked})">Salvar chegada</button>`);
}

/* ---- CRÉDITO ---- */
function vCredito(){
  const c=D.credito,pct=Math.min(100,c.usado/c.limite*100);
  let h=`<div class="card"><div class="row sp"><div><div class="k">Em aberto</div><div class="big">${brl(c.valorAberto)}</div></div><div style="text-align:right"><div class="k">Disponível</div><div class="mid">${kg(c.disponivel)}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row sp mut" style="font-size:13px"><span>Usado ${kg(c.usado)}</span><span>Limite ${kg(c.limite)}</span></div></div>
  <button class="btn sec" style="margin:0 0 6px" onclick="fCredito()">+ Lançar nota no crédito</button>
  <div class="k" style="margin:16px 4px 6px">Notas em aberto · prazo 15 dias</div>`;
  c.aberto.slice().sort((a,b)=>a.venc<b.venc?-1:1).forEach(x=>{const cl=x.dias<0?'bad':x.dias<=3?'warn':'';h+=`<div class="card ${cl?'alert '+cl:''}"><div class="row sp"><b style="font:800 20px var(--serif)">${brl(x.valor)}</b><span class="pill ${cl||'pe'}">${x.dias<0?'Vencida há '+(-x.dias)+'d':x.dias===0?'Vence hoje':'Vence '+dbr(x.venc)+' · '+x.dias+'d'}</span></div><div class="mut" style="font-size:13px;margin:4px 0 2px">Nota de ${dbr(x.data)} · ${kg(x.restante)}${x.obs?' · '+esc(x.obs):''}</div><button class="btn" style="margin-top:10px;padding:10px" onclick="if(confirm('Marcar nota de ${brl(x.valor)} como paga?'))acao('pagarNota',{linha:${x.linha},pago:true},false)">Marcar como paga</button></div>`});
  if(!c.aberto.length)h+='<p class="mut">Nenhuma nota em aberto.</p>';
  h+=`<div class="k" style="margin:16px 4px 6px">Histórico</div><div class="card"><table><tr><th>Nota</th><th>Valor</th><th>Venc.</th><th></th></tr>${c.lanc.map(l=>`<tr><td>${dbr(l.data)}</td><td>${brl(l.valor)}</td><td>${dbr(l.venc)}</td><td>${l.pago?`<span class="pill ok">Paga</span>`:/pagamento/i.test(l.tipo)?`<span class="pill">Pagto</span>`:`<span class="pill warn">Aberta</span>`}</td></tr>`).join('')}</table></div>`;
  return h;
}
function fCredito(){
  open_(`<h2>Nota no crédito</h2>
  <p class="mut">Use para notas que não vieram de uma entrega ou chegada lançada no app. Vence 15 dias depois da data da nota.</p>
  <label>Data da nota (faturamento)</label><input id="fdt" type="date" value="${hoje()}">
  <div class="grid2"><div><label>Valor da nota (R$)</label><input id="fvl" inputmode="decimal"></div><div><label>Quilos</label><input id="fkg" inputmode="decimal" placeholder="automático"></div></div>
  <label>Observação</label><input id="fob" placeholder="ex: nº da nota">
  <button class="btn" onclick="acao('lancarCredito',{tipo:'Compra',data:val('fdt'),kg:num(val('fkg')),valor:num(val('fvl')),obs:val('fob')})">Salvar nota</button>`);
}

/* ---- RELATÓRIOS ---- */
function vRelat(){
  const ms=meses(),dono=D.user.dono;
  const l=todas().filter(x=>!R.mes||x.mes===R.mes);
  const by={};l.forEach(x=>{const b=by[x.cliente]=by[x.cliente]||{n:0,kg:0,v:0,rec:0,l:0};b.n++;b.kg+=x.kgEntregue||0;b.v+=x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado);b.rec+=aReceber(x);b.l+=x.lucro||0});
  const rows=Object.entries(by).sort((a,b)=>b[1].kg-a[1].kg);
  const tot=rows.reduce((s,[,b])=>({kg:s.kg+b.kg,v:s.v+b.v,rec:s.rec+b.rec,l:s.l+b.l}),{kg:0,v:0,rec:0,l:0});
  let h=`<select style="margin-bottom:10px" onchange="R.mes=this.value;render()"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${m===R.mes?'selected':''}>${mesNome(m)}</option>`).join('')}</select>
  <div class="grid2"><div class="card"><div class="k">Kg entregue</div><div class="mid">${kg(tot.kg)}</div></div><div class="card"><div class="k">Faturado</div><div class="mid">${brl(tot.v)}</div></div>
  <div class="card"><div class="k">A receber</div><div class="mid">${brl(tot.rec)}</div></div>${dono?`<div class="card"><div class="k">Lucro</div><div class="mid" style="color:var(--ok)">${brl(tot.l)}</div></div>`:`<div class="card"><div class="k">Vendas</div><div class="mid">${l.length}</div></div>`}</div>
  <div class="card"><div class="k" style="margin-bottom:6px">Por cliente</div><table><tr><th>Cliente</th><th>Kg</th><th>Valor</th>${dono?'<th>Lucro</th>':'<th>A receber</th>'}</tr>
  ${rows.map(([c,b])=>`<tr><td>${esc(c)}</td><td>${n0(b.kg)}</td><td>${brl(b.v)}</td><td>${dono?brl(b.l):brl(b.rec)}</td></tr>`).join('')}</table></div>`;
  // por mês
  const bm={};todas().forEach(x=>{if(!x.mes)return;const b=bm[x.mes]=bm[x.mes]||{kg:0,v:0,l:0};b.kg+=x.kgEntregue||0;b.v+=x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado);b.l+=x.lucro||0});
  const mx=Math.max(1,...Object.values(bm).map(b=>b.kg));
  h+=`<div class="card"><div class="k" style="margin-bottom:8px">Kg por mês</div>${Object.keys(bm).sort().map(m=>`<div style="margin-bottom:8px"><div class="row sp" style="font-size:13px"><span>${mesNome(m)}</span><span>${kg(bm[m].kg)}${dono?' · <span style="color:var(--ok)">'+brl(bm[m].l)+'</span>':''}</span></div><div class="bar" style="margin:3px 0"><i style="width:${bm[m].kg/mx*100}%"></i></div></div>`).join('')}</div>`;
  // por cor
  const bc={};l.forEach(x=>{for(const k in x.entregue||{})bc[k]=(bc[k]||0)+x.entregue[k]});
  h+=`<div class="card"><div class="k" style="margin-bottom:6px">Rolos entregues por cor</div><table>${D.cores.filter(k=>bc[k]).sort((a,b)=>bc[b]-bc[a]).map(k=>`<tr><td><span class="dot" style="background:${COR_HEX[k]}"></span> ${k}</td><td>${bc[k]}</td></tr>`).join('')}</table></div>`;
  return h+`<button class="btn sec" onclick="store('tec_pin');location.reload()">Sair</button>`;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const p=getStore('tec_pin');if(p){$('#pin').value=p;entrar()}$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()})})();
</script>
