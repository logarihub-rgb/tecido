<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tecido">
<title>Tecido</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0d;--card:#1a1815;--card2:#221f1b;--ink:#ece4d4;--mut:#9a907c;--line:#2e2a24;--acc:#b8904f;--acc-ink:#15120e;--ok:#8fae6b;--warn:#d6a74a;--bad:#c4553b;--r:12px;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{background:
 repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
 repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px),
 radial-gradient(ellipse at top,#1d1a16 0%,#0f0e0d 60%);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(12,11,10,.96);backdrop-filter:blur(6px);color:var(--ink);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
header h1{margin:0;font:800 20px/1 var(--serif);letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
header small{color:var(--mut);font-size:11px;letter-spacing:.5px}
main{padding:14px 12px 100px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0c0b0a;border-top:1px solid var(--acc);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.big{font:800 30px/1.1 var(--serif);letter-spacing:-.3px;color:var(--ink)}
.mid{font:700 19px/1.2 var(--serif)}
.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:#2a2620;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a35,var(--acc))}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:3px;background:#2a2620;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3c4a2e}.pill.warn{color:var(--warn);border-color:#5a4724}.pill.bad{color:var(--bad);border-color:#5a2a20}.pill.pe{color:#c9b892;border-color:#4a4233}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit}
.item b{font-family:var(--serif);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 12px;font:inherit;font-size:12px;letter-spacing:.4px;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
select,input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#141210;color:var(--ink);color-scheme:dark}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:8px;padding:14px;font:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;background:var(--acc);color:var(--acc-ink);margin-top:14px}
.btn.sec{background:transparent;color:var(--acc)}
.btn.wa{background:#1f3b2a;border-color:#2f5a3f;color:#cfe9d6}
.fab{position:fixed;right:16px;bottom:84px;z-index:7;border:1px solid var(--acc);border-radius:30px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:13px;padding:14px 20px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cor{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:#141210}
.cor span{display:flex;align-items:center;gap:6px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:inline-block;flex:none}
.step{display:flex;align-items:center}
.step button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#221f1b;color:var(--ink);font-size:18px}
.step input{width:40px;border:0;background:transparent;text-align:center;padding:4px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);border-top:1px solid var(--acc);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 8px;font:800 22px/1.2 var(--serif)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:1px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;font-weight:600}
.load{position:fixed;inset:0;background:rgba(10,9,8,.7);z-index:30;display:flex;align-items:center;justify-content:center;font:700 16px var(--serif);letter-spacing:2px;color:var(--acc)}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto;text-align:center}
#login h1{font:800 44px/1 var(--serif);letter-spacing:8px;color:var(--acc);margin:0 0 6px}
#login .rule{height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:14px 0 22px}
#login input{font-size:26px;text-align:center;letter-spacing:10px}
.alert{border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.estq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.estq div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}
.estq b{display:block;font:800 22px var(--serif)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.rolos{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rolo{display:grid;grid-template-columns:48px 1fr 92px 30px;gap:8px;align-items:center;background:#141210;border:1px solid var(--line);border-radius:8px;padding:6px}
.rolo img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.rolo select,.rolo input{padding:7px 8px;font-size:14px}
.rolo .x{border:0;background:none;color:var(--bad);font-size:20px}
.tot{font:800 26px var(--serif);color:var(--acc)}
#cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;font-weight:600}
#cam .camtop button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:1px}
#cam .cambar{background:#0c0b0a;border-top:1px solid var(--acc);padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
#camthumbs{display:flex;gap:6px;overflow-x:auto;width:100%;min-height:52px}
#camthumbs div{position:relative;flex:none}
#camthumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#camthumbs span{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.7);color:var(--acc);border-radius:0 0 6px 6px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--acc);background:#ece4d4;box-shadow:0 0 0 4px #0c0b0a inset}
.shutter:active{transform:scale(.92);background:var(--acc)}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:.7;pointer-events:none;animation:fl .25s forwards}
@keyframes fl{to{opacity:0}}
.sync{font-size:11px;color:var(--mut);margin-left:6px}.sync.on::before{content:'';display:inline-block;width:8px;height:8px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite;vertical-align:-1px}
@keyframes gira{to{transform:rotate(360deg)}}
.fila{background:#2a1a10;border:1px solid #6a2f20;color:#f0b48a;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}.fila button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:7px 10px;font:inherit;font-weight:700;font-size:12px}
.sx{position:sticky;top:0;float:right;background:none;border:0;color:var(--mut);font-size:22px;line-height:1;padding:0 2px 6px 10px}
.rolo .ac{display:flex;gap:4px}.rolo .ac button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--acc);font-size:14px;padding:4px 7px}
#fv{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}#fv img{flex:1;object-fit:contain;width:100%;min-height:0}#fv div{padding:12px;display:flex;gap:8px;background:#111}#fv input{flex:1}
.nfl{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;background:#141210;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
@media print{body>*:not(#modal){display:none!important}#modal .sheet{position:static;background:#fff}#modal .sheet>div{max-height:none;background:#fff;color:#000;box-shadow:none}#modal button,#modal input,#modal label,.noprint{display:none!important}.nfl{background:#fff;color:#000;border:0;font-size:13px}}
</style>
</head>
<body>
<div id="login">
  <h1>TECIDO</h1>
  <p class="mut" style="margin:0;letter-spacing:3px;text-transform:uppercase;font-size:11px">Logari · Mooca</p><div class="rule"></div>
  <p class="mut" style="margin:0 0 10px">Digite seu PIN</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="btn" onclick="entrar()">Entrar</button>
  <p id="lerr" style="color:var(--bad)"></p>
</div>
<div id="app" style="display:none">
  <header><div><h1>Tecido</h1><small id="sub"></small><span id="sync" class="sync"></span></div><button onclick="carregar(true)" style="background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--acc);font:inherit;font-size:12px">↻ Atualizar</button></header>
  <main id="view"></main>
  <nav>
    <button data-t="inicio" onclick="ir('inicio')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-t="vendas" onclick="ir('vendas')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Vendas</button>
    <button data-t="estoque" onclick="ir('estoque')"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Estoque</button>
    <button data-t="credito" onclick="ir('credito')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Crédito</button>
    <button data-t="relat" onclick="ir('relat')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Relatórios</button>
  </nav>
</div>
<div id="modal"></div>
<script>
const COR_HEX={Preto:'#1d1d1d',Marrom:'#6b4226',Branco:'#f4f1ea',Marfim:'#efe6cf',Rubro:'#9b1c2c',Marinho:'#1f2f57',Rubi:'#b0124a',Canela:'#a5643a',Amarelo:'#e8c33a',Frozen:'#bcd7e6',Hera:'#e58fb5'};
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let PIN='',D=null,TAB='inicio',F={mes:'',cli:'',st:'aberto',tipo:'todos'},R={mes:''};
const $=s=>document.querySelector(s);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kg=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+' kg';
const n0=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const dbr=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const mesNome=m=>m?MES[+m.slice(5,7)-1]+'/'+m.slice(2,4):'';
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function getStore(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function loading(on){let e=$('#ld');if(on&&!e){e=document.createElement('div');e.id='ld';e.className='load';e.textContent='Carregando…';document.body.appendChild(e)}if(!on&&e)e.remove()}
const API='https://script.google.com/macros/s/AKfycbyQv3EXg8p4_41qEuMetFS5D7rf9SCjlbpyPJ3i71U3NaOEJM9qj5SaHOn49GnSwUYc/exec';
async function post(action,p){const r=await fetch(API,{method:'POST',body:JSON.stringify({pin:PIN,action,p:p||{}}),redirect:'follow'});const j=await r.json();if(!j||!j.ok)throw new Error(j?j.erro:'Erro');return j}
async function call(action,p,quiet){if(!quiet)loading(true);try{return await post(action,p)}catch(e){if(/Failed to fetch|NetworkError|Load failed|JSON/.test(e.message))throw new Error('Sem conexão. Tente de novo.');throw e}finally{if(!quiet)loading(false)}}
function sync(on){const e=$('#sync');if(e)e.className='sync'+(on?' on':'')}
const CK=()=>'tec_d_'+PIN;
async function entrar(){PIN=$('#pin').value.trim();if(!PIN)return;await filaInicia();const cache=getStore(CK());
  if(cache){try{store('tec_pin',PIN);abrir();setD(JSON.parse(cache),true);carregar();return}catch(e){}}
  try{await call('login');store('tec_pin',PIN);abrir();carregar()}catch(e){$('#lerr').textContent=e.message;if(/PIN/.test(e.message))store('tec_pin')}}
function abrir(){$('#login').style.display='none';$('#app').style.display='block';history.replaceState({t:TAB},'')}
let CARR=false,RAW=null,EXT=null,FILA=[],PEDE_EXT=false;
const EK=()=>'tec_ext_'+PIN;
function extLocal(){if(EXT)return EXT;try{EXT=JSON.parse(getStore(EK())||'null')}catch(e){EXT=null}return EXT}
async function carregar(force){if(CARR)return;CARR=true;sync(true);if(!D)loading(true);
  try{const ex=extLocal();const r=await call('dados',{force:!!force,ev:ex?ex.versao:''},true);setD(r.data);if(force)toast('Atualizado')}
  catch(e){if(/PIN/.test(e.message)){store('tec_pin');store(CK());store(EK());location.reload();return}if(!D)toast(e.message);else if(force)toast('Sem sinal — usando os dados do celular')}
  finally{CARR=false;sync(FILA.length>0);loading(false);if(FILA.length)processaFila()}}
// dados = o que veio do servidor (RAW) + extrato dos meses fechados + lançamentos ainda não enviados
function monta(){const ex=extLocal();D=JSON.parse(JSON.stringify(RAW));D.vendas=D.vendas.concat(ex?JSON.parse(JSON.stringify(ex.vendas)):[]);FILA.forEach(it=>{try{aplica(it.a,it.p)}catch(e){}})}
function setD(d,doCache){
  if(d.extrato){EXT=d.extrato;store(EK(),JSON.stringify(EXT))}delete d.extrato;
  RAW=d;if(!doCache)store(CK(),JSON.stringify(RAW));monta();
  $('#sub').textContent=d.user.nome+' · '+String(d.atualizado).slice(-5);if(!F.mes){F.mes=D.vendas.length?ultimoMes():'';R.mes=F.mes}
  const ex=extLocal();if(!doCache&&(!ex||ex.versao!==RAW.extratoVersao)&&!PEDE_EXT&&navigator.onLine){PEDE_EXT=true;setTimeout(()=>{carregar().finally(()=>PEDE_EXT=false)},50)}
  render()}
// fila no próprio celular (IndexedDB): funciona sem sinal e envia sozinha quando conectar
function idb(){return new Promise((ok,er)=>{const r=indexedDB.open('tecido',1);r.onupgradeneeded=()=>r.result.createObjectStore('fila',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,er)=>{const tx=db.transaction('fila',mode),req=fn(tx.objectStore('fila'));tx.oncomplete=()=>ok(req&&req.result);tx.onerror=()=>er(tx.error)})}
async function filaInicia(){try{FILA=(await idbOp('readonly',st=>st.getAll()))||[];const old=JSON.parse(getStore('tec_fila')||'[]');for(const o of old){const it={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),a:o.a,p:o.p,pin:PIN,api:API};FILA.push(it);await idbOp('readwrite',st=>st.put(it))}store('tec_fila')}catch(e){}}
let ENV=false;
async function processaFila(){if(!FILA.length)return;sync(true);
  if('serviceWorker' in navigator&&'SyncManager' in window){try{const reg=await navigator.serviceWorker.ready;await reg.sync.register('fila');return}catch(e){}}
  if(ENV)return;ENV=true;
  while(FILA.length){const it=FILA[0];let r;try{r=await call(it.a,Object.assign({},it.p,{_id:it.id}),true)}catch(e){if(/Sem conexão/.test(e.message))break;r={ok:false,erro:e.message}}await feito(it.id,r)}
  ENV=false;sync(FILA.length>0)}
async function feito(id,r){FILA=FILA.filter(x=>x.id!==id);try{await idbOp('readwrite',st=>st.delete(id))}catch(e){}
  if(r.ok){toast(r.msg||'Salvo');if(r.data&&!FILA.length)setD(r.data);else{monta();render()}}else{toast('Não salvou: '+r.erro);monta();render()}if(!FILA.length)sync(false)}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{const m=e.data||{};if(m.tipo==='feito'){FILA=FILA.filter(x=>x.id!==m.id);if(m.ok){toast(m.msg||'Salvo');if(m.data&&!FILA.length)setD(m.data);else{monta();render()}}else{toast('Não salvou: '+m.erro);monta();render()}if(!FILA.length)sync(false)}});
window.addEventListener('online',()=>{if(FILA.length)processaFila();carregar()});
function acao(action,p,fechar=true){const it={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),a:action,p,pin:PIN,api:API};FILA.push(it);idbOp('readwrite',st=>st.put(it)).catch(()=>{});
  if(fechar)close_();monta();render();toast(navigator.onLine?'Salvando…':'Salvo no celular · envia quando tiver sinal');processaFila()}
function vFila(){if(!FILA.length)return'';return`<div class="fila"><span>${FILA.length} lançamento${FILA.length>1?'s':''} ${navigator.onLine?'sendo enviado…':'aguardando sinal (já está salvo no celular)'}</span>${navigator.onLine?`<button onclick="processaFila()">Enviar agora</button>`:''}</div>`}
// aplica o lançamento na tela na hora, mesmo sem sinal
const somaC=c=>Object.values(c||{}).reduce((s,n)=>s+(+n||0),0);
function achaV(aba,linha){return D.vendas.find(x=>x.aba===aba&&x.linha===+linha)}
function achaR(linha){return (D.inv.retiradas||[]).find(x=>x.linha===+linha)}
function baixaEst(cores,kgv){const e=D.inv.estoque;for(const k in cores){e.cores[k]=(e.cores[k]||0)-cores[k];e.qtde-=cores[k]}e.kg-=(+kgv||0)}
function excluir(i){const x=todas()[i],q=x.tipo==='pronta'?x.qtdEntregue:x.qtdPedido;
  if(!confirm(`Excluir ${x.tipo==='pronta'?'a retirada':'o pedido'} de ${x.cliente} de ${dbr(x.data)} (${n0(q)} rolos)? Isso não tem volta.`))return;
  if(x.tipo==='pronta')acao('excluirRetirada',{linha:x.linha,cliente:x.cliente,data:x.data});else acao('excluirPedido',{aba:x.aba,linha:x.linha,cliente:x.cliente,data:x.data})}
function aplica(a,p){
  if(a==='foraProjecao'){D.fora=(D.fora||[]).filter(c=>c!==p.cliente);if(p.fora)D.fora.push(p.cliente);return}
  if(a==='receberFornecedor'){const x=D.inv.pedidos.find(r=>r.linha===+p.linha);if(!x)return;const e=D.inv.estoque;for(const k of D.cores){const d=(p.cores[k]||0)-((x.entregue||{})[k]||0);if(d){e.cores[k]=(e.cores[k]||0)+d;e.qtde+=d}}e.kg+=(+p.kg||0)-(x.kgEntregue||0);
    x.dataEntrega=p.data;x.entregue=p.cores;x.qtdEntregue=somaC(p.cores);x.kgEntregue=p.kg;x.statusEnt=Object.keys(x.pedido||{}).some(k=>(x.pedido[k]||0)>(p.cores[k]||0))?'parcial':'';return}
  if(a==='encerrarFornecedor'){const x=D.inv.pedidos.find(r=>r.linha===+p.linha);if(x)x.statusEnt='encerrado';return}
  if(a==='excluirPedido'){D.vendas=D.vendas.filter(x=>!(x.aba===p.aba&&x.linha===+p.linha));return}
  if(a==='excluirRetirada'){const x=achaR(p.linha);if(x){const e=D.inv.estoque;for(const k in x.entregue){e.cores[k]=(e.cores[k]||0)+x.entregue[k];e.qtde+=x.entregue[k]}D.inv.retiradas=D.inv.retiradas.filter(r=>r!==x)}return}
  if(a==='excluirPedidoFornecedor'){D.inv.pedidos=D.inv.pedidos.filter(r=>r.linha!==+p.linha);return}
  if(a==='salvarPedido'&&!p.aba&&!p.forcar&&D.vendas.some(x=>!x.pend&&x.cliente===p.cliente&&x.data===p.data&&D.cores.every(k=>(x.pedido[k]||0)===(p.cores[k]||0))))return;
  if(a==='salvarPedido'){const q=somaC(p.cores),pk=p.precoKg||D.padrao.precoKg,kp=q*D.padrao.kgRolo;let x=p.aba&&p.linha?achaV(p.aba,p.linha):null;
    if(!x){x={tipo:'encomenda',aba:'',linha:0,protocolo:'(enviando)',entregue:{},qtdEntregue:0,kgEntregue:0,valorReal:0,recebido:0,pago:false,frete:0,fotos:[],rolos:[],pend:true};D.vendas.push(x)}
    Object.assign(x,{data:p.data,cliente:p.cliente,precoKg:pk,pedido:p.cores,qtdPedido:q,kgPedido:kp,estimado:kp*pk,mes:(p.data||'').slice(0,7)});if(p.recebido!==''&&p.recebido!=null)x.recebido=+p.recebido;
    if(!D.clientes.includes(p.cliente))D.clientes.push(p.cliente)}
  else if(a==='registrarEntrega'){const x=achaV(p.aba,p.linha);if(!x)return;x.dataEntrega=p.data;x.entregue=p.cores;x.qtdEntregue=somaC(p.cores);x.kgEntregue=p.kg;x.valorReal=Math.round(p.kg*x.precoKg*100)/100;if(p.frete!=null)x.frete=+p.frete||0;
    x.statusEnt=Object.keys(x.pedido||{}).some(k=>(x.pedido[k]||0)>(p.cores[k]||0))?'parcial':'';if(p.doEstoque){x.doEstoque=true;baixaEst(p.append?p.coresParte:p.cores,p.append?p.kgParte:p.kg)}}
  else if(a==='pagamentoVenda'){const x=p.tipo==='pronta'?achaR(p.linha):achaV(p.aba,p.linha);if(!x)return;const novo=p.total!=null&&p.total!==''?+p.total:(x.recebido||0)+(+p.add||0);x.recebido=Math.round(novo*100)/100;if(x.tipo==='pronta'||x.valorReal)x.pago=novo>=totalV(x)-0.01;if(p.pagoFornecedor!=null)x.pagoFornecedor=!!p.pagoFornecedor}
  else if(a==='novaRetirada'){let x=p.linha?achaR(p.linha):null;if(!x){x={tipo:'pronta',aba:D.inv.aba,linha:0,pago:false,recebido:0,fotos:[],rolos:[],pend:true};D.inv.retiradas.push(x);baixaEst(p.cores,p.kg)}
    Object.assign(x,{cliente:p.cliente,data:p.data,mes:(p.data||'').slice(0,7),entregue:p.cores,qtdEntregue:somaC(p.cores),kgEntregue:p.kg,precoKg:p.precoKg,valorReal:Math.round(p.kg*p.precoKg*100)/100});if(p.frete!=null)x.frete=+p.frete||0}
  else if(a==='salvarExtras'){const x=achaV(p.aba,p.linha);if(x&&p.status!=null)x.statusEnt=p.status}
  else if(a==='salvarNF'){const x=p.tipo==='pronta'?achaR(p.linha):achaV(p.aba,p.linha);if(x)x.nfValor=p.valor}
  else if(a==='salvarCliente'){const c=(D.cadastro=D.cadastro||[]);const ix=p.linha?c.findIndex(z=>z.linha===+p.linha):-1;if(ix>=0)c[ix]=Object.assign({},c[ix],p);else c.push(Object.assign({linha:0},p))}
  else if(a==='excluirEmpresa'){D.cadastro=(D.cadastro||[]).filter(z=>z.linha!==+p.linha)}
}
function ir(t){if(t!==TAB){TAB=t;history.pushState({t},'')}window.scrollTo(0,0);render()}
function render(){if(!D)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));const v=$('#view');let h='';try{h=({inicio:vInicio,vendas:vVendas,estoque:vEstoque,credito:vCredito,relat:vRelat,clientes:vClientes,sugestao:vSugestao})[TAB]()}catch(e){h='<p class="mut">Erro: '+esc(e.message)+'</p>'}v.innerHTML=vFila()+h}
// botão voltar do celular: fecha foto, câmera, janela; senão volta para a aba anterior
let MST=[],SKIP=0;
window.addEventListener('popstate',e=>{
  if(SKIP){SKIP--;return}
  if($('#fv')){$('#fv').remove();return}
  if($('#cam')){fecharCamera();return}
  if(MST.length){MST.pop();if(MST.length){mostra(MST[MST.length-1])}else{fecharCamera();$('#modal').innerHTML=''}return}
  if(e.state&&e.state.t){TAB=e.state.t;window.scrollTo(0,0);render()}
});

/* ---- dados derivados ---- */
function todas(){return D.vendas.concat((D.inv.retiradas||[]).filter(r=>!r.baixa))}
function meses(){return [...new Set(todas().map(x=>x.mes).filter(Boolean))].sort().reverse()}
function ultimoMes(){return meses()[0]||''}
function valorV(x){return x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado)}
function totalV(x){return valorV(x)+(x.frete||0)}
function aReceber(x){if(x.pago)return 0;if(x.tipo!=='pronta'&&!x.dataEntrega)return 0;return Math.max(0,Math.round((totalV(x)-(x.recebido||0))*100)/100)}
function faltaEnt(x){if(x.tipo==='pronta')return null;const o={};let t=0;
  if(!x.dataEntrega){for(const k in x.pedido){if(x.pedido[k]){o[k]=x.pedido[k];t+=x.pedido[k]}}}
  else if(x.statusEnt==='parcial'){for(const k in x.pedido){const d=(x.pedido[k]||0)-((x.entregue||{})[k]||0);if(d>0){o[k]=d;t+=d}}}
  return t?{cores:o,qtde:t}:null}
const faltaTxt=f=>Object.entries(f.cores).map(([k,n])=>n+' '+k).join(', ');
function statusV(x){
  if(x.tipo!=='pronta'&&!x.dataEntrega)return{t:'A entregar',c:'pe'};
  if(aReceber(x)>0.01)return{t:'A receber',c:'warn'};
  if(faltaEnt(x))return{t:'Falta entregar',c:'pe'};
  return{t:'Concluído',c:'ok'};
}

/* ---- INÍCIO ---- */
function vInicio(){
  const c=D.credito,m=ultimoMes(),vm=todas().filter(x=>x.mes===m);
  const pend=pendentes();
  const rec=todas().reduce((s,x)=>s+aReceber(x),0);
  const venc=c.aberto.filter(x=>metaN(x)<=2);
  const pct=Math.min(100,c.usado/c.limite*100);
  let h='';
  venc.forEach(x=>{const m=metaN(x);h+=`<div class="card alert ${m<0||x.dias<0?'bad':''}" onclick="ir('credito')"><b>${x.dias<0?'Nota vencida':m<0?'Passou da meta de 10 dias':m===0?'Meta de 10 dias: pagar hoje':'Meta de 10 dias: pagar em '+m+' dia'+(m>1?'s':'')}</b> · ${brl(x.valor)} (até ${dbr(metaD(x))})</div>`});
  h+=`<div class="card" onclick="ir('credito')"><div class="row sp"><div><div class="k">Crédito fornecedor · em aberto</div><div class="big">${brl(c.valorAberto)}</div></div><div style="text-align:right"><div class="k">Disponível</div><div class="mid">${kg(c.disponivel)}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut" style="font-size:13px">${kg(c.usado)} usados de ${kg(c.limite)}</div></div>`;
  h+=`<div class="grid2"><div class="card" onclick="ir('estoque')"><div class="k">Estoque livre</div><div class="mid">${n0(D.inv.estoque.qtde-comprometido().qtde)} rolos</div><div class="mut">${n0(D.inv.estoque.qtde)} total · ${n0(comprometido().qtde)} comprometidos</div></div>
  <div class="card"><div class="k">A entregar</div><div class="mid">${pend.length} pedidos</div><div class="mut">${n0(pend.reduce((s,x)=>s+faltaEnt(x).qtde,0))} rolos</div></div>
  <div class="card"><div class="k">A receber</div><div class="mid">${brl(rec)}</div></div>
  <div class="card"><div class="k">Vendido ${mesNome(m)}</div><div class="mid">${kg(vm.reduce((s,x)=>s+(x.kgEntregue||0),0))}</div>${D.user.dono?`<div style="color:var(--ok);font-weight:600">Lucro ${brl(vm.reduce((s,x)=>s+(x.lucro||0),0))}</div>`:''}</div></div>`;
  h+=`<div class="card"><div class="k" style="margin-bottom:8px">Ações rápidas</div><div class="grid2">
  <button class="btn" style="margin:0" onclick="fPedido()">+ Pedido</button>
  <button class="btn" style="margin:0" onclick="fRetirada()">+ Retirada</button>
  <button class="btn sec" style="margin:0" onclick="fFornecedor()">Pedido fornecedor</button>
  <button class="btn sec" style="margin:0" onclick="ir('clientes')">Clientes / NF</button></div></div>`;
  if(pend.length){h+=`<div class="k" style="margin:14px 4px 6px">Aguardando entrega</div>`;pend.slice(0,6).forEach(x=>h+=itemV(x))}
  return h;
}

/* ---- VENDAS ---- */
function itemV(x){
  const s=statusV(x),i=todas().indexOf(x);
  const qt=x.tipo==='pronta'?x.qtdEntregue:x.qtdPedido;
  const val=totalV(x),fal=aReceber(x);
  return `<button class="item" onclick="detV(${i})"><div class="row sp"><b>${esc(x.cliente)}</b><span class="pill ${s.c}">${s.t}</span></div>
  <div class="row sp mut" style="font-size:13px;margin-top:3px"><span>${dbr(x.data)} · ${x.tipo==='pronta'?'<span class="pill pe" style="font-size:10px">Pronta entrega</span>':esc(x.protocolo)} · ${n0(qt)} rolos</span><span>${fal>0.01&&fal<val-0.01?'falta '+brl(fal):brl(val)}</span></div>${x.dataEntrega&&faltaEnt(x)?`<div style="font-size:12.5px;color:var(--warn);margin-top:2px">Falta entregar: ${faltaTxt(faltaEnt(x))}</div>`:''}</button>`;
}
function vVendas(){
  const ms=meses();
  if(['aberto','A entregar','A receber','Concluído'].indexOf(F.st)<0)F.st='aberto';
  const conc=F.st==='Concluído',fim=x=>statusV(x).t==='Concluído';
  const base=todas().filter(x=>!INTERNO.test(x.cliente)&&(!F.cli||x.cliente===F.cli)&&(F.tipo==='todos'||x.tipo===F.tipo));
  let l=base.filter(x=>conc?(fim(x)&&(!F.mes||x.mes===F.mes)):F.st==='A entregar'?!!faltaEnt(x):F.st==='A receber'?aReceber(x)>0.01:!fim(x));
  const nConc=base.filter(fim).length;
  l.sort((a,b)=>(b.data||'')<(a.data||'')?-1:1);
  let h=`<div class="grid2" style="margin-bottom:8px">${conc?`<select onchange="F.mes=this.value;render()"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${m===F.mes?'selected':''}>${mesNome(m)}</option>`).join('')}</select>`:''}
  <select onchange="F.cli=this.value;render()"><option value="">Todos clientes</option>${D.clientes.map(c=>`<option ${c===F.cli?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`;
  h+=`<div class="chips">${[['aberto','Em aberto'],['A entregar','A entregar'],['A receber','A receber'],['Concluído','Concluídos']].map(s=>`<button class="${F.st===s[0]?'on':''}" onclick="F.st='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`;
  h+=`<div class="chips">${[['todos','Tudo'],['encomenda','Encomendas'],['pronta','Pronta entrega']].map(s=>`<button class="${F.tipo===s[0]?'on':''}" onclick="F.tipo='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`;
  const tkg=l.reduce((s,x)=>s+(x.kgEntregue||0),0),tv=l.reduce((s,x)=>s+(x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado)),0);
  h+=`<div class="card row sp"><div><div class="k">${l.length} vendas</div><b>${kg(tkg)}</b></div><div style="text-align:right"><div class="k">Valor</div><b>${brl(tv)}</b></div>${D.user.dono?`<div style="text-align:right"><div class="k">Lucro</div><b style="color:var(--ok)">${brl(l.reduce((s,x)=>s+(x.lucro||0),0))}</b></div>`:''}</div>`;
  h+=l.map(itemV).join('')||`<p class="mut">${conc?'Nenhuma venda concluída nesse filtro.':'Nada em aberto. Tudo entregue e recebido ✓'}</p>`;
  if(!conc&&nConc)h+=`<button class="btn sec" style="margin-top:10px" onclick="F.st='Concluído';render()">Ver concluídos (${nConc}) ›</button>`;
  return h+`<button class="fab" onclick="fPedido()">+ Pedido</button>`;
}
function tabCores(a,b,la,lb){
  const ks=D.cores.filter(k=>(a&&a[k])||(b&&b[k]));
  if(!ks.length)return '<p class="mut">Sem cores lançadas.</p>';
  return `<table><tr><th>Cor</th><th>${la}</th>${b?`<th>${lb}</th>`:''}</tr>${ks.map(k=>`<tr><td><span class="dot" style="background:${COR_HEX[k]}"></span> ${k}</td><td>${a&&a[k]||'—'}</td>${b?`<td>${b[k]||'—'}</td>`:''}</tr>`).join('')}</table>`;
}
function detV(i){
  const x=todas()[i],s=statusV(x),dono=D.user.dono,fal=aReceber(x),rec=x.recebido||0;
  if(x.pend)return open_(`<h2>${esc(x.cliente)}</h2><p class="mut">Lançamento ainda não enviado para a planilha. Assim que tiver sinal ele sobe sozinho; depois disso dá para editar.</p>`);
  let h=`<div class="row sp"><h2>${esc(x.cliente)}</h2><span class="pill ${s.c}">${s.t}</span></div>`;
  const fin=`<tr><td>Tecido</td><td>${brl(valorV(x))}</td></tr>${x.frete?`<tr><td>Frete</td><td>${brl(x.frete)}</td></tr>`:''}<tr><td><b>Total</b></td><td><b>${brl(totalV(x))}</b></td></tr><tr><td>Recebido</td><td>${brl(rec)}</td></tr>${fal>0.01?`<tr><td><b>Falta receber</b></td><td><b style="color:var(--warn)">${brl(fal)}</b></td></tr>`:rec-totalV(x)>0.01&&x.tipo!=='pronta'&&x.dataEntrega?`<tr><td>A devolver</td><td>${brl(rec-totalV(x))}</td></tr>`:''}${x.nfValor?`<tr><td>Valor na nota fiscal</td><td>${brl(x.nfValor)}</td></tr>`:''}${x.nf?`<tr><td>Nota fiscal (custo)</td><td>${brl(x.nf)}</td></tr>`:''}`;
  if(x.tipo==='pronta'){
    h+=`<p class="mut">Pronta entrega · ${dbr(x.data)}</p><div class="card">${tabCores(x.entregue,null,'Rolos')}</div>
    <div class="card"><table><tr><td>Quilos</td><td>${kg(x.kgEntregue)}</td></tr><tr><td>Preço/kg</td><td>${brl(x.precoKg)}</td></tr>${fin}${dono?`<tr><td>Lucro</td><td style="color:var(--ok)">${brl(x.lucro)}</td></tr>`:''}</table></div>`;
  }else{
    h+=`<p class="mut">${esc(x.protocolo)} · pedido ${dbr(x.data)} · entrega ${dbr(x.dataEntrega)}${x.doEstoque?' · saiu do estoque':''}</p>
    <div class="card">${tabCores(x.pedido,x.entregue,'Pedido','Entregue')}</div>
    <div class="card"><table><tr><td>Rolos</td><td>${n0(x.qtdPedido)} → ${n0(x.qtdEntregue)}</td></tr><tr><td>Quilos</td><td>${kg(x.kgPedido)} → ${kg(x.kgEntregue)}</td></tr><tr><td>Preço/kg</td><td>${brl(x.precoKg)}</td></tr>${fin}
    ${dono?`<tr><td>Lucro</td><td style="color:var(--ok);font-weight:700">${brl(x.lucro)}</td></tr><tr><td>Fornecedor pago</td><td>${x.pagoFornecedor?'Sim':'Não'}</td></tr>`:''}</table></div>`;
  }
  const fe=x.dataEntrega?faltaEnt(x):null;
  if(fe)h+=`<div class="card alert"><b>Falta entregar: ${faltaTxt(fe)}</b><div class="grid2" style="margin-top:10px"><button class="btn" style="margin:0" onclick="fEntrega(${i},true)">Entregar o restante</button><button class="btn sec" style="margin:0" onclick="if(confirm('Encerrar o pedido? O que falta não será mais entregue.'))acao('salvarExtras',{aba:'${esc(x.aba)}',linha:${x.linha},cliente:'${esc(x.cliente)}',status:'encerrado'})">Encerrar</button></div></div>`;
  const entregue=x.tipo==='pronta'||x.dataEntrega;
  if(entregue)h+=`<button class="btn wa" onclick="whatsV(${i},this)">WhatsApp + fotos${x.fotos&&x.fotos.length?' ('+x.fotos.length+')':''}</button>`;
  if(entregue)h+=`<div class="grid2"><button class="btn" style="margin:0" onclick="fPagto(${i})">Recebimento</button><button class="btn sec" style="margin:0" onclick="fNF(${i})">Nota fiscal</button></div>`;
  h+=x.tipo==='pronta'?`<button class="btn sec" onclick="fRetirada(${i})">Editar retirada</button>`:`<button class="btn sec" onclick="fEntrega(${i})">${x.dataEntrega?'Corrigir entrega':'Registrar entrega'}</button><button class="btn sec" onclick="fPedido(${i})">Editar pedido</button>`;
  h+=`<button class="btn sec" style="color:var(--bad);border-color:#6a2f20" onclick="excluir(${i})">Excluir ${x.tipo==='pronta'?'retirada':'pedido'}</button>`;
  open_(h);
}

/* ---- FORMULÁRIOS ---- */
function mostra(h){$('#modal').innerHTML=`<div class="sheet" onclick="if(event.target===this)history.back()"><div><button class="sx noprint" aria-label="Fechar" onclick="history.back()">×</button>${h}</div></div>`}
function open_(h){MST.push(h);mostra(h);history.pushState({m:MST.length},'')}
function close_(){const n=MST.length+($('#cam')?1:0)+($('#fv')?1:0);fecharCamera();const f=$('#fv');if(f)f.remove();MST=[];$('#modal').innerHTML='';if(n){SKIP++;history.go(-n)}}
function coresInput(id,val){
  return `<div class="cores" id="${id}">${D.cores.map(k=>`<div class="cor"><span><i class="dot" style="background:${COR_HEX[k]}"></i>${k}</span><span class="step"><button type="button" onclick="stp(this,-1)">−</button><input inputmode="numeric" data-c="${k}" value="${val&&val[k]||''}" placeholder="0"><button type="button" onclick="stp(this,1)">+</button></span></div>`).join('')}</div>`;
}
function stp(b,d){const i=b.parentNode.querySelector('input');i.value=Math.max(0,(+i.value||0)+d)||'';i.dispatchEvent(new Event('input',{bubbles:true}))}
function lerCores(id){const o={};document.querySelectorAll('#'+id+' input').forEach(i=>{if(+i.value)o[i.dataset.c]=+i.value});return o}
function cliInput(v){return `<label>Cliente</label><input id="fcli" list="lcli" value="${esc(v||'')}" placeholder="Nome do cliente"><datalist id="lcli">${D.clientes.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
const val=id=>$('#'+id).value;

function fPedido(i){
  const x=i!=null?todas()[i]:null;
  open_(`<h2>${x?'Editar pedido':'Novo pedido (encomenda)'}</h2>${cliInput(x&&x.cliente)}
  <div class="grid2"><div><label>Data</label><input id="fdt" type="date" value="${x?x.data:hoje()}"></div><div><label>Preço/kg</label><input id="fpk" inputmode="decimal" value="${x?x.precoKg:D.padrao.precoKg}"></div></div>

    if(r.erro){$('#clres').innerHTML='<span style="color:var(--bad)">'+esc(r.erro)+'. Digite o CNPJ e toque em Buscar.</span>';return}

    $('#clres').innerHTML=`<b style="color:var(--ok)">Dados preenchidos</b>${r.situacao&&r.situacao!=='ATIVA'?' · <span style="color:var(--bad)">situação '+esc(r.situacao)+'</span>':''}${r.aviso?' · '+esc(r.aviso):''}<br>Falta só a inscrição estadual (não vem no cartão). Confira e salve.`}

  if(!D.inv.pedidos.length)h+='<p class="mut">Nenhum pedido.</p>';

  return h;

let NFV=null,FRUP=()=>{};
let FRESTO=false;
function faltaF(p){const o={};let t=0;
  if(!p.dataEntrega){for(const k in p.pedido){if(p.pedido[k]){o[k]=p.pedido[k];t+=p.pedido[k]}}}
  else if(p.statusEnt==='parcial'){for(const k in p.pedido){const d=(p.pedido[k]||0)-((p.entregue||{})[k]||0);if(d>0){o[k]=d;t+=d}}}
  return t?{cores:o,qtde:t}:null}
function sChegada(i){const p=D.inv.pedidos[i],P={linha:p.linha,data:val('fdt'),dataNF:val('fnf'),cores:lerCores('fc'),kg:num(val('fkg')),preco:p.preco||0,credito:true,valorNF:NFV&&NFV.valor||0};
  if(FRESTO){const c=Object.assign({},p.entregue);for(const k in P.cores)c[k]=(c[k]||0)+P.cores[k];P.kgParte=P.kg;P.kg=Math.round(((p.kgEntregue||0)+P.kg)*100)/100;P.cores=c;P.append=true}
  acao('receberFornecedor',P)}
function fReceber(i,resto){
  const p=D.inv.pedidos[i];NFV=null;FRESTO=!!resto;const ff=faltaF(p);
  open_(`<h2>${resto?'Restante':'Chegada'} · ${esc(p.protocolo)}</h2><p class="mut">Pedido de ${dbr(p.data)} · ${n0(p.qtdPedido)} rolos${p.dataEntrega?' · já chegaram '+n0(p.qtdEntregue):''}</p>${!resto&&p.dataEntrega&&ff?`<div class="card alert"><b>Falta chegar: ${faltaTxt(ff)}</b><div class="grid2" style="margin-top:10px"><button class="btn" style="margin:0" onclick="fReceber(${i},true)">Receber o restante</button><button class="btn sec" style="margin:0" onclick="if(confirm('Encerrar? O que falta não vem mais.'))acao('encerrarFornecedor',{linha:${p.linha}})">Encerrar</button></div></div>`:''}
  <div class="card" style="margin-top:10px"><div class="row sp"><div><div class="k">Nota fiscal do fornecedor</div><div class="mut" style="font-size:12px" id="nfres">Foto ou PDF da nota: preenche os quilos e a data de faturamento</div></div><label class="btn" style="width:auto;margin:0;padding:10px 12px;cursor:pointer">📄 Ler nota<input type="file" accept="image/*,application/pdf" style="display:none" onchange="lerNF(this.files[0]);this.value=''"></label></div></div>

  <label>Data da nota (faturamento)</label><input id="fnf" type="date" value="${resto?hoje():(p.dataEntrega||hoje())}">
  <p class="mut" id="fcrinfo" style="font-size:13px"></p>
  <button class="btn" onclick="sChegada(${i})">Salvar chegada</button>
  <button class="btn sec" style="color:var(--bad);border-color:#6a2f20" onclick="if(confirm('Excluir o pedido ao fornecedor de ${dbr(p.data)} (${n0(p.qtdPedido)} rolos)? Isso não tem volta.'))acao('excluirPedidoFornecedor',{linha:${p.linha},data:'${p.data}'})">Excluir pedido do fornecedor</button>`);
  const pk=p.preco||D.padrao.custoKg||0,up=()=>{const k=num(val('fkg')),nf=val('fnf');const v=nf?dbr(new Date(new Date(nf+'T12:00').getTime()+15*864e5).toISOString().slice(0,10)):'';
    $('#fcrinfo').textContent=NFV&&NFV.valor?`Entra no crédito sozinho: ${brl(NFV.valor)} (valor da nota) · ${kg(k)} · vence ${v}`:k?`Entra no crédito sozinho: ${kg(k)}${pk?' × '+brl(pk)+' = '+brl(k*pk):''} · vence ${v}`:'O crédito do fornecedor é lançado sozinho com os quilos recebidos.'};
  FRUP=up;$('#fkg').addEventListener('input',up);$('#fnf').addEventListener('input',up);up();

function arquivoB64(file){return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=er;r.readAsDataURL(file)})}
function fotoB64(file){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const M=2400,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',.9).split(',')[1])};img.onerror=er;img.src=URL.createObjectURL(file)})}
function nfCores(r){const pc=r.porCor||{},ks=Object.keys(pc);if(!ks.length)return'';const kr=D.padrao.kgRolo||19.3,est={};ks.forEach(k=>est[k]=Math.max(1,Math.round(pc[k]/kr)));
  const tot=Object.values(est).reduce((a,b)=>a+b,0);if(r.volumes&&tot===r.volumes&&!FRESTO)document.querySelectorAll('#fc input').forEach(i=>{i.value=est[i.dataset.c]||''});
  return '<br>Por cor: '+ks.map(k=>est[k]+' '+k+' ('+kg(pc[k])+')').join(' · ')+(r.volumes&&tot!==r.volumes?' <span style="color:var(--warn)">— estimativa não fecha com '+r.volumes+' rolos, confira as cores</span>':'')}
async function lerNF(file){if(!file)return;const pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(pdf&&file.size>8e6)return toast('PDF muito grande');
  $('#nfres').textContent='Lendo a nota…';
  try{const b64=pdf?await arquivoB64(file):await fotoB64(file);const r=(await call('lerNF',{b64,mime:pdf?'application/pdf':'image/jpeg'})).r;NFV=r;
    if(r.kg)$('#fkg').value=String(r.kg).replace('.',',');if(r.data)$('#fnf').value=r.data;
    $('#nfres').innerHTML=(r.kg||r.data)?`<b style="color:var(--ok)">Nota lida${r.numero?' nº '+esc(r.numero):''}</b> · faturada ${dbr(r.data)} · ${r.kg?kg(r.kg):'kg ?'}${r.valor?' · '+brl(r.valor):''}${r.volumes?' · '+r.volumes+' rolos':''}${r.venc?' · vence '+dbr(r.venc):''}${nfCores(r)}<br>Confira antes de salvar.`:'<span style="color:var(--bad)">Não achei o peso nem a data. Digite abaixo.</span>';
    FRUP()}
  catch(e){$('#nfres').innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'. Digite os dados abaixo.</span>'}}

const difD=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);

const META_PAG=10;
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const metaD=x=>addD(x.data,META_PAG),metaN=x=>difD(metaD(x),hoje());
// ---- SUGESTÃO DE PEDIDO: consumo de cada cliente + estoque + atraso e falhas do fornecedor ----
let SG={sem:6,ciclo:7,margem:10};
function entregasJanela(dias){const ini=addD(hoje(),-dias),L=[];
  D.vendas.forEach(x=>{if(x.dataEntrega&&x.dataEntrega>=ini&&!INTERNO.test(x.cliente))L.push({cli:x.cliente,data:x.dataEntrega,cores:x.entregue||{}})});
  (D.inv.retiradas||[]).forEach(x=>{if(!x.baixa&&x.data>=ini&&!INTERNO.test(x.cliente))L.push({cli:x.cliente,data:x.data,cores:x.entregue||{}})});
  const fo=D.fora||[];return L.filter(e=>fo.indexOf(e.cli)<0)}
function foraProj(c,f){if(f&&!confirm('Tirar '+c+' da projeção? As compras dele deixam de contar até você voltar com ele.'))return;acao('foraProjecao',{cliente:c,fora:!!f},false)}
function sugestao(){
  const W=SG.sem,dias=W*7,L=entregasJanela(dias),cores=D.cores;
  // prazo do fornecedor (pedido → chegada) e confiabilidade por cor nos últimos pedidos
  const ped=D.inv.pedidos.filter(p=>p.dataEntrega&&p.data);const lts=ped.slice(-6).map(p=>Math.max(0,difD(p.dataEntrega,p.data)));
  const ltMed=lts.length?lts.reduce((a,b)=>a+b,0)/lts.length:2,ltMax=lts.length?Math.max(...lts):3;
  const conf={},falhas={};cores.forEach(k=>{const ps=ped.filter(p=>p.pedido[k]).slice(-3);const pd=ps.reduce((s,p)=>s+p.pedido[k],0),rc=ps.reduce((s,p)=>s+((p.entregue||{})[k]||0),0);conf[k]=pd?rc/pd:1;falhas[k]=ps.filter(p=>!((p.entregue||{})[k])).length});
  // consumo semanal por cor (média e variação)
  const sem={};cores.forEach(k=>sem[k]=Array(W).fill(0));
  L.forEach(e=>{const w=Math.min(W-1,Math.floor(difD(hoje(),e.data)/7));for(const k in e.cores)if(sem[k])sem[k][w]+=e.cores[k]});
  const cobrir=SG.ciclo+ltMax,z=1,cp=comprometido(),est=D.inv.estoque.cores,cam={};
  D.inv.pedidos.forEach(p=>{const f=faltaF(p);if(f)for(const k in f.cores)cam[k]=(cam[k]||0)+f.cores[k]});
  const linhas=cores.map(k=>{const v=sem[k],mu=v.reduce((a,b)=>a+b,0)/W,sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)*(b-mu),0)/W);
    const prev=mu/7*cobrir,seg=z*sd*Math.sqrt(cobrir/7),r=Math.max(conf[k],0);
    const disp=(est[k]||0)-(cp.cores[k]||0)+(cam[k]||0);
    let q=prev*(1+SG.margem/100)+seg-disp;q=Math.max(0,Math.round(q));
    return{k,mu,sd,prev,seg,disp,conf:conf[k],falhas:falhas[k],cam:cam[k]||0,q}}).filter(l=>l.mu>0||l.q>0||l.cam>0);
  // clientes
  const by={};L.forEach(e=>{const b=by[e.cli]=by[e.cli]||{datas:new Set(),cores:{}};b.datas.add(e.data);for(const k in e.cores)b.cores[k]=(b.cores[k]||0)+e.cores[k]});
  const clis=Object.entries(by).map(([c,b])=>{const ds=[...b.datas].sort(),n=ds.length,int=n>1?difD(ds[n-1],ds[0])/(n-1):7*W;
    const porVez={};for(const k in b.cores)porVez[k]=Math.round(b.cores[k]/n);return{c,n,freq:n/W,int,ult:ds[n-1],prox:addD(ds[n-1],Math.round(int)),porVez,tot:Object.values(b.cores).reduce((a,x)=>a+x,0)}}).sort((a,b)=>b.tot-a.tot);
  return{linhas,clis,ltMed,ltMax,cobrir}}
function vSugestao(){
  const S=sugestao(),tot=S.linhas.reduce((s,l)=>s+l.q,0),kgT=tot*D.padrao.kgRolo,cred=D.credito.disponivel;
  const sel=(id,ops,v)=>`<select onchange="SG.${id}=+this.value;render()">${ops.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  let h=`<button class="tog" style="margin-bottom:10px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--acc)" onclick="history.back()">‹ Voltar</button>
  <div class="card"><div class="k">Sugestão de pedido ao fornecedor</div><div class="mut" style="font-size:12.5px;margin-top:4px">Baseado no que cada cliente pegou, no estoque livre, no que está a caminho, no prazo do fornecedor (média ${n0(S.ltMed)}d, até ${n0(S.ltMax)}d) e nas cores que ele deixou de mandar.</div>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><div><label>Histórico</label>${sel('sem',[[4,'4 semanas'],[6,'6 semanas'],[8,'8 semanas'],[12,'12 semanas']],SG.sem)}</div><div><label>Próximo pedido em</label>${sel('ciclo',[[3,'3 dias'],[5,'5 dias'],[7,'7 dias'],[10,'10 dias'],[14,'14 dias']],SG.ciclo)}</div><div><label>Margem extra</label>${sel('margem',[[0,'0%'],[10,'10%'],[15,'15%'],[25,'25%'],[40,'40%']],SG.margem)}</div></div></div>`;
  h+=`<div class="card"><div class="row sp"><div><div class="k">Pedir agora</div><div class="big">${n0(tot)} rolos</div><div class="mut" style="font-size:13px">≈ ${kg(kgT)} · cobre ${S.cobrir} dias</div></div><div style="text-align:right"><div class="k">Crédito disponível</div><div class="mid" style="color:${kgT>cred?'var(--bad)':'var(--ok)'}">${kg(cred)}</div>${kgT>cred?'<div style="color:var(--bad);font-size:12px">passa do crédito</div>':''}</div></div>
  <table style="margin-top:10px"><tr><th style="text-align:left">Cor</th><th>Sai/sem</th><th>Livre</th><th>Pedir</th></tr>${S.linhas.map(l=>`<tr><td><span class="dot" style="background:${COR_HEX[l.k]}"></span> ${l.k}${l.conf<0.95?` <span style="color:var(--warn);font-size:11px">⚠ veio ${Math.round(l.conf*100)}%</span>`:''}</td><td>${l.mu.toFixed(1).replace('.',',')}</td><td style="color:${l.disp<0?'var(--bad)':'inherit'}">${n0(l.disp)}</td><td><b style="font-size:16px">${l.q||'—'}</b></td></tr>`).join('')}</table>
  ${S.linhas.filter(l=>l.falhas>=2).map(l=>`<div class="mut" style="font-size:12.5px;color:var(--warn);margin-top:8px">⚠ ${l.k}: o fornecedor não mandou nos últimos ${l.falhas} pedidos. O que está a caminho já conta na conta, então não pedi a mais. Vale cobrar o prazo dele.</div>`).join('')}
  <button class="btn" style="margin-top:12px" onclick="fFornecedor(${esc(JSON.stringify(Object.fromEntries(S.linhas.filter(l=>l.q).map(l=>[l.k,l.q]))))})">Fazer pedido com essa sugestão</button>
  <p class="mut" style="font-size:12px;margin:8px 0 0">"Livre" = estoque − pedidos de clientes ainda não entregues + o que está a caminho. Você pode ajustar as quantidades antes de salvar.</p></div>`;
  h+=`<div class="k" style="margin:14px 4px 6px">O que cada cliente costuma pegar (últimas ${SG.sem} semanas)</div>`;
  h+=S.clis.map(c=>{const atras=c.prox<hoje();return `<div class="card"><div class="row sp"><b style="font:800 17px var(--serif)">${esc(c.c)}</b><span class="pill ${atras?'warn':'pe'}">${c.freq>=0.9?'~'+n0(c.freq)+'x por semana':'a cada ~'+n0(c.int)+' dias'}</span></div>
    <div class="mut" style="font-size:13px;margin-top:4px">Por vez: ${Object.entries(c.porVez).filter(([k,n])=>n).map(([k,n])=>n+' '+k).join(' · ')||'—'}</div>
    <div style="font-size:13px;margin-top:4px">Última: ${dbr(c.ult)} · próxima provável: <b style="color:${atras?'var(--warn)':'inherit'}">${dbr(c.prox)}${atras?' (já passou)':''}</b></div><button class="btn sec" style="margin:8px 0 0;padding:8px;font-size:13px" onclick="foraProj('${esc(c.c).replace(/'/g,"\\'")}',true)">Parou de comprar · tirar da projeção</button></div>`}).join('')||'<p class="mut">Sem entregas no período.</p>';
  const fo=D.fora||[];if(fo.length)h+=`<div class="k" style="margin:14px 4px 6px">Fora da projeção</div>`+fo.map(c=>`<div class="card row sp"><b>${esc(c)}</b><button class="btn sec" style="width:auto;margin:0;padding:8px 12px" onclick="foraProj('${esc(c).replace(/'/g,"\\'")}',false)">Voltar</button></div>`).join('');
  return h}

/* ---- CRÉDITO ---- */
function vCredito(){
  const c=D.credito,pct=Math.min(100,c.usado/c.limite*100);
  let h=`<div class="card"><div class="row sp"><div><div class="k">Em aberto</div><div class="big">${brl(c.valorAberto)}</div></div><div style="text-align:right"><div class="k">Disponível</div><div class="mid">${kg(c.disponivel)}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row sp mut" style="font-size:13px"><span>Usado ${kg(c.usado)}</span><span>Limite ${kg(c.limite)}</span></div></div>
  <button class="btn sec" style="margin:0 0 6px" onclick="fCredito()">+ Lançamento manual (só se precisar)</button>
  <div class="k" style="margin:16px 4px 6px">Notas em aberto · prazo 15 dias</div>`;
  const pg=c.lanc.filter(l=>l.pago&&l.pagoEm&&/compra|nota/i.test(l.tipo));
  if(pg.length){const m1=pg.reduce((s,l)=>s+difD(l.pagoEm,l.data),0)/pg.length,m2=pg.filter(l=>l.venc).reduce((s,l)=>s+difD(l.venc,l.pagoEm),0)/Math.max(1,pg.filter(l=>l.venc).length);
    h=h.replace('<button class="btn sec" style="margin:0 0 6px"',`<div class="card"><div class="k">Seu prazo de pagamento</div><div class="mid">${n0(m1)} dias</div><div class="mut" style="font-size:13px">em média da compra até quitar · meta ${META_PAG} dias ${m1<=META_PAG?'✓':'— acima da meta'} · ${n0(m2)} dias antes do vencimento (${pg.length} notas)</div></div><button class="btn sec" style="margin:0 0 6px"`)}
  c.aberto.slice().sort((a,b)=>a.venc<b.venc?-1:1).forEach(x=>{const cl=x.dias<0||metaN(x)<0?'bad':metaN(x)<=2?'warn':'';h+=`<div class="card ${cl?'alert '+cl:''}"><div class="row sp"><b style="font:800 20px var(--serif)">${brl(x.valor)}</b><span class="pill ${cl||'pe'}">${x.dias<0?'Vencida há '+(-x.dias)+'d':x.dias===0?'Vence hoje':'Vence '+dbr(x.venc)+' · '+x.dias+'d'}</span></div><div class="mut" style="font-size:13px;margin:4px 0 2px">Nota de ${dbr(x.data)} · ${kg(x.restante)}${x.obs?' · '+esc(x.obs):''}</div><div style="font-size:13px;font-weight:600;color:${metaN(x)<0?'var(--bad)':metaN(x)<=2?'var(--warn)':'var(--ok)'}">Meta 10 dias: pagar até ${dbr(metaD(x))} · ${metaN(x)<0?'passou '+(-metaN(x))+'d':'faltam '+metaN(x)+'d'}</div><button class="btn" style="margin-top:10px;padding:10px" onclick="fPagarNota(${x.linha},'${x.data}','${x.venc}',${x.valor})">Marcar como paga</button></div>`});
  if(!c.aberto.length)h+='<p class="mut">Nenhuma nota em aberto.</p>';
  h+=`<div class="k" style="margin:16px 4px 6px">Histórico</div><div class="card"><table><tr><th>Nota</th><th>Valor</th><th>Venc.</th><th></th></tr>${c.lanc.map(l=>`<tr><td>${dbr(l.data)}</td><td>${brl(l.valor)}</td><td>${dbr(l.venc)}</td><td>${l.pago?`<span class="pill ok">Paga ${dbr(l.pagoEm)}${l.pagoEm?' · '+difD(l.pagoEm,l.data)+'d':''}</span>`:/pagamento/i.test(l.tipo)?`<span class="pill">Pagto</span>`:`<span class="pill warn">Aberta</span>`}</td></tr>`).join('')}</table></div>`;
  return h;
}
function fCredito(){
  open_(`<h2>Nota no crédito</h2>
  <p class="mut">Use para notas que não vieram de uma entrega ou chegada lançada no app. Vence 15 dias depois da data da nota.</p>
  <label>Data da nota (faturamento)</label><input id="fdt" type="date" value="${hoje()}">
  <div class="grid2"><div><label>Valor da nota (R$)</label><input id="fvl" inputmode="decimal"></div><div><label>Quilos</label><input id="fkg" inputmode="decimal" placeholder="automático"></div></div>
  <label>Observação</label><input id="fob" placeholder="ex: nº da nota">
  <button class="btn" onclick="acao('lancarCredito',{tipo:'Compra',data:val('fdt'),kg:num(val('fkg')),valor:num(val('fvl')),obs:val('fob')})">Salvar nota</button>`);
}

/* ---- RELATÓRIOS ---- */
function vRelat(){
  const ms=meses(),dono=D.user.dono;
  const l=todas().filter(x=>!R.mes||x.mes===R.mes);
  const by={};l.forEach(x=>{const b=by[x.cliente]=by[x.cliente]||{n:0,kg:0,v:0,rec:0,l:0};b.n++;b.kg+=x.kgEntregue||0;b.v+=totalV(x);b.rec+=aReceber(x);b.l+=x.lucro||0});
  const rows=Object.entries(by).sort((a,b)=>b[1].kg-a[1].kg);
  const tot=rows.reduce((s,[,b])=>({kg:s.kg+b.kg,v:s.v+b.v,rec:s.rec+b.rec,l:s.l+b.l}),{kg:0,v:0,rec:0,l:0});
  let h=`<select style="margin-bottom:10px" onchange="R.mes=this.value;render()"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${m===R.mes?'selected':''}>${mesNome(m)}</option>`).join('')}</select>
  <div class="grid2"><div class="card"><div class="k">Kg entregue</div><div class="mid">${kg(tot.kg)}</div></div><div class="card"><div class="k">Faturado</div><div class="mid">${brl(tot.v)}</div></div>
  <div class="card"><div class="k">A receber</div><div class="mid">${brl(tot.rec)}</div></div>${dono?`<div class="card"><div class="k">Lucro</div><div class="mid" style="color:var(--ok)">${brl(tot.l)}</div></div>`:`<div class="card"><div class="k">Vendas</div><div class="mid">${l.length}</div></div>`}</div>
  <div class="card"><div class="k" style="margin-bottom:6px">Por cliente</div><table><tr><th>Cliente</th><th>Kg</th><th>Valor</th>${dono?'<th>Lucro</th>':'<th>A receber</th>'}</tr>
  ${rows.map(([c,b])=>`<tr><td>${esc(c)}</td><td>${n0(b.kg)}</td><td>${brl(b.v)}</td><td>${dono?brl(b.l):brl(b.rec)}</td></tr>`).join('')}</table></div>`;
  // por mês
  const bm={};todas().forEach(x=>{if(!x.mes)return;const b=bm[x.mes]=bm[x.mes]||{kg:0,v:0,l:0};b.kg+=x.kgEntregue||0;b.v+=x.tipo==='pronta'?x.valorReal:(x.valorReal||x.estimado);b.l+=x.lucro||0});
  const mx=Math.max(1,...Object.values(bm).map(b=>b.kg));
  h+=`<div class="card"><div class="k" style="margin-bottom:8px">Kg por mês</div>${Object.keys(bm).sort().map(m=>`<div style="margin-bottom:8px"><div class="row sp" style="font-size:13px"><span>${mesNome(m)}</span><span>${kg(bm[m].kg)}${dono?' · <span style="color:var(--ok)">'+brl(bm[m].l)+'</span>':''}</span></div><div class="bar" style="margin:3px 0"><i style="width:${bm[m].kg/mx*100}%"></i></div></div>`).join('')}</div>`;
  // por cor
  const bc={};l.forEach(x=>{for(const k in x.entregue||{})bc[k]=(bc[k]||0)+x.entregue[k]});
  h+=`<div class="card"><div class="k" style="margin-bottom:6px">Rolos entregues por cor</div><table>${D.cores.filter(k=>bc[k]).sort((a,b)=>bc[b]-bc[a]).map(k=>`<tr><td><span class="dot" style="background:${COR_HEX[k]}"></span> ${k}</td><td>${bc[k]}</td></tr>`).join('')}</table></div>`;
  return h+`<button class="btn sec" onclick="if(confirm('Recalcular o histórico dos meses fechados? Use só se você mudou meses antigos direto na planilha.'))acao('recalcular',{},false)">Recalcular histórico</button><button class="btn sec" onclick="if(FILA.length&&!confirm('Tem lançamentos ainda não enviados. Sair mesmo assim?'))return;store('tec_pin');location.reload()">Sair</button>`;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const p=getStore('tec_pin');if(p){$('#pin').value=p;entrar()}$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()})})();
</script>
